{% extends "base.html" %}
{% block content %}
<div class="hero">
    <h1>CheZZ</h1>
    <p class="subtitle">Play chess with friends</p>

    <form action="/games/create" method="post">
        <button type="submit" class="btn btn-primary btn-lg">Create New Game</button>
    </form>

    <p class="hint">
        Share the game link with a friend to play together.<br>
        Games expire 24 hours after creation.
    </p>
</div>
{% endblock %}
