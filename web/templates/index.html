{% extends "base.html" %}
{% block content %}
<div class="hero">
    <h1>🎮 GameZZ</h1>
    <p class="subtitle">{{ _('Choose a game') }}</p>

    <div class="game-list">
        <a href="/chess" class="game-card">
            <span class="game-icon">♟</span>
            <span class="game-name">{{ _('Chess') }}</span>
            <span class="game-desc">{{ _('Play chess with friends') }}</span>
        </a>
        <a href="/battleship" class="game-card">
            <span class="game-icon">🚢</span>
            <span class="game-name">{{ _('Battleship') }}</span>
            <span class="game-desc">{{ _('Play battleship with friends') }}</span>
        </a>
    </div>
</div>
{% endblock %}
