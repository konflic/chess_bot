{% extends "base.html" %}
{% block content %}
<div class="hero">
    <h1>CheZZ</h1>
    <p class="subtitle">{{ _('Play chess with friends') }}</p>

    <form action="/games/create" method="post">
        <button type="submit" class="btn btn-primary btn-lg">{{ _('Create New Game') }}</button>
    </form>

    <p class="hint">
        {{ _('Share the game link with a friend to play together.') }}<br>
        {{ _('Games expire 24 hours after creation.') }}<br>
        <a href="/battleship" class="btn btn-secondary btn-sm" style="margin-top: 10px;">🚢 {{ _('Battleship') }}</a>
    </p>
</div>
{% endblock %}
